<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusShield</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎯 FocusShield</h1>
      <button id="themeToggle" class="theme-toggle" title="Toggle Dark Mode">
        <span class="theme-icon">🌙</span>
      </button>
    </header>
    
    <!-- Pomodoro Timer Section -->
    <div id="pomodoroSection" class="pomodoro-section">
      <div class="pomodoro-ring">
        <svg class="progress-ring" width="200" height="200">
          <defs>
            <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
            </linearGradient>
            <linearGradient id="breakGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#28a745;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#20c997;stop-opacity:1" />
            </linearGradient>
          </defs>
          <circle class="progress-ring-bg" cx="100" cy="100" r="90" />
          <circle id="progressCircle" class="progress-ring-circle" cx="100" cy="100" r="90" />
        </svg>
        <div class="pomodoro-content">
          <span id="pomodoroStatus" class="pomodoro-status">Ready</span>
          <span id="timeRemaining" class="pomodoro-time">25:00</span>
          <span id="sessionType" class="session-type">Focus Time</span>
          <div class="progress-percentage" id="progressPercentage">100%</div>
        </div>
      </div>
      
      <div class="pomodoro-controls">
        <button id="startFocusBtn" class="btn btn-primary btn-circle" title="Start">
          <span class="btn-icon">▶</span>
        </button>
        <button id="pauseFocusBtn" class="btn btn-warning btn-circle hidden" title="Pause">
          <span class="btn-icon">⏸</span>
        </button>
        <button id="stopFocusBtn" class="btn btn-danger btn-circle hidden" title="Stop">
          <span class="btn-icon">⏹</span>
        </button>
        <button id="skipBtn" class="btn btn-secondary btn-circle hidden" title="Skip">
          <span class="btn-icon">⏭</span>
        </button>
      </div>
      
      <div class="session-indicators">
        <span id="sessionDots" class="session-dots">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </span>
        <span class="session-count">Session <span id="currentSession">1</span>/4</span>
      </div>
    </div>

    <div id="sessionControls" class="controls-section">
      <div class="duration-selector">
        <label for="durationSelect">Focus Duration:</label>
        <select id="durationSelect">
          <option value="25">25 min (Pomodoro)</option>
          <option value="40">40 min (Extended)</option>
          <option value="50">50 min (Deep Work)</option>
          <option value="custom">Custom</option>
        </select>
      </div>
      
      <div id="customDurationInput" class="custom-duration hidden">
        <label for="customMinutes">Custom (minutes):</label>
        <input type="number" id="customMinutes" min="1" max="120" value="30">
      </div>
      
      <div class="break-settings">
        <div class="break-option">
          <label for="shortBreak">Short Break:</label>
          <select id="shortBreak">
            <option value="5">5 min</option>
            <option value="10">10 min</option>
            <option value="15">15 min</option>
          </select>
        </div>
        <div class="break-option">
          <label for="longBreak">Long Break:</label>
          <select id="longBreak">
            <option value="15">15 min</option>
            <option value="20">20 min</option>
            <option value="30">30 min</option>
          </select>
        </div>
      </div>
    </div>

    <div class="quick-stats">
      <div class="stat-item">
        <span class="stat-icon">🔥</span>
        <span id="todayMinutes" class="stat-value">0</span>
        <span class="stat-label">min today</span>
      </div>
      <div class="stat-item">
        <span class="stat-icon">📈</span>
        <span id="streakCount" class="stat-value">0</span>
        <span class="stat-label">day streak</span>
      </div>
    </div>

    <div class="links-section">
      <button id="openDashboard" class="btn btn-link">📊 Dashboard</button>
      <button id="openOptions" class="btn btn-link">⚙️ Settings</button>
    </div>
  </div>
  <script src="db.js"></script>
  <script src="popup.js"></script>
</body>
</html>
