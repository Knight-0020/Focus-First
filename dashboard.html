<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusShield - Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 FocusShield Dashboard</h1>
      <div class="header-actions">
        <button id="refreshBtn" class="btn btn-secondary">Refresh</button>
        <button id="backToPopup" class="btn btn-link">← Back</button>
      </div>
    </header>

    <div class="stats-grid">
      <!-- Today's Focus Summary -->
      <div class="stat-card">
        <h2>Today's Focus</h2>
        <div class="stat-value" id="todayFocusTime">0 min</div>
        <div class="stat-label" id="todaySessions">0 sessions</div>
      </div>

      <!-- Streak -->
      <div class="stat-card">
        <h2>Current Streak</h2>
        <div class="stat-value" id="streakDays">0 days</div>
        <div class="stat-label">Consecutive days</div>
      </div>

      <!-- Distractions -->
      <div class="stat-card">
        <h2>Distractions</h2>
        <div class="stat-value" id="distractionCount">0</div>
        <div class="stat-label">Today</div>
      </div>

      <!-- Total Sessions -->
      <div class="stat-card">
        <h2>Total Sessions</h2>
        <div class="stat-value" id="totalSessions">0</div>
        <div class="stat-label">All time</div>
      </div>
    </div>

    <!-- Top Sites -->
    <div class="section">
      <h2>Top Sites (Time Spent)</h2>
      <div id="topSitesList" class="top-sites-list">
        <p class="empty-state">No data yet</p>
      </div>
    </div>

    <!-- Achievements -->
    <div class="section">
      <h2>Achievements</h2>
      <div id="achievementsList" class="achievements-list">
        <p class="empty-state">No achievements unlocked yet</p>
      </div>
    </div>

    <!-- Focus Time Chart -->
    <div class="section">
      <h2>Focus Time (Last 7 Days)</h2>
      <canvas id="focusTimeChart"></canvas>
    </div>
  </div>
  <script src="db.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
